[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-log-analyzer-muzanhex"
version = "0.1.0"
description = "A lightweight, dependency-free Python CLI for structured application and syslog analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mohammad Shihab" }]
license = "MIT"
keywords = ["linux", "logs", "python", "cli", "syslog", "devops"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Topic :: System :: Logging",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
linux-log-analyzer = "log_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["log_analyzer*"]
